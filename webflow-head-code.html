<link rel="stylesheet" href="https://unpkg.com/lenis@1.1.18/dist/lenis.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');

:root {

}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

.lenis.lenis-smooth { scroll-behavior: auto !important; }
body { position: relative; min-height: 100vh; background-color: var(--bg-current); color: var(--text-current); transition: background-color 0.8s var(--ease-out-expo), color 0.8s var(--ease-out-expo); overflow-x: hidden; }

.ambient-noise { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 9999; opacity: 0.035; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E"); }

.custom-cursor { position: fixed; top: 0; left: 0; width: 32px; height: 32px; border: 1px solid currentColor; border-radius: 50%; pointer-events: none; z-index: 10000; transform: translate(-50%, -50%); transition: width 0.3s var(--ease-out-expo), height 0.3s var(--ease-out-expo), background-color 0.3s; display: flex; align-items: center; justify-content: center; mix-blend-mode: difference; color: #FFF; }

.signal-thread-wrapper { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 10; }

.nav-title-group { display: flex; flex-direction: column; }
.nav-name { font-weight: 600; font-size: 0.95rem; }

.nav-actions { display: flex; align-items: center; gap: 2rem; }

.nav-status-badge { display: flex; align-items: center; gap: 0.5rem; padding: 0.4rem 0.85rem; border-radius: 999px; border: 1px solid var(--border-current); background-color: var(--card-current); font-family: var(--font-mono); font-size: 0.72rem; color: var(--muted-current); }

.section-hero { min-height: 100vh; padding: 11rem 3.5rem 6rem; display: flex; flex-direction: column; justify-content: space-between; max-width: 1560px; margin: 0 auto; }

.hero-headline { font-size: clamp(3rem, 7.5vw, 7.25rem); line-height: 0.96; letter-spacing: -0.035em; font-weight: 400; margin-bottom: 2rem; }

.hero-substrate-capsules { display: flex; flex-wrap: wrap; gap: 0.75rem; }
.substrate-capsule { display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.5rem 1rem; border-radius: 999px; background-color: var(--card-current); border: 1px solid var(--border-current); font-family: var(--font-mono); font-size: 0.78rem; }
.hero-scroll-indicator { display: flex; justify-content: space-between; border-top: 1px solid var(--border-current); padding-top: 1.5rem; font-family: var(--font-mono); font-size: 0.75rem; color: var(--muted-current); margin-top: 5rem; }

.section-philosophy { padding: 8rem 3.5rem; max-width: 1560px; margin: 0 auto; border-top: 1px solid var(--border-current); }

.section-label::before { content: ''; width: 18px; height: 1px; background-color: currentColor; }

.philosophy-index { font-family: var(--font-mono); font-size: 0.8rem; color: var(--color-steel); font-weight: 600; }
.philosophy-title { font-family: var(--font-display); font-size: 2.1rem; line-height: 1.15; font-weight: 400; margin: 1.5rem 0 1rem; }
.philosophy-body { font-size: 0.95rem; color: var(--muted-current); line-height: 1.6; }

.section-work { position: relative; padding: 8rem 0; background-color: var(--color-navy); color: var(--color-navy-text); overflow: hidden; }
.work-header-wrap { max-width: 1560px; margin: 0 auto 5rem; padding: 0 3.5rem; }
.work-headline { font-size: clamp(2.5rem, 5vw, 5rem); font-weight: 400; line-height: 1; }

.project-meta-col { display: flex; flex-direction: column; justify-content: space-between; height: 100%; }
.project-tag-row { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1.25rem; }
.project-year-badge { font-family: var(--font-mono); font-size: 0.75rem; padding: 0.25rem 0.65rem; border-radius: 999px; border: 1px solid var(--color-navy-border); color: var(--color-steel-light); }
.project-cat-label { font-family: var(--font-mono); font-size: 0.75rem; color: var(--color-navy-muted); }
.project-title { font-size: clamp(2.2rem, 3.5vw, 3.75rem); font-weight: 500; margin-bottom: 1rem; line-height: 1.05; }
.project-tagline { font-size: 1.1rem; color: var(--color-navy-muted); line-height: 1.5; margin-bottom: 2rem; }
.project-stack-tags { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 2.5rem; }

.project-links-group { display: flex; align-items: center; gap: 1.25rem; }

.btn-secondary { display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.85rem 1.4rem; border-radius: 999px; border: 1px solid var(--color-navy-border); color: var(--color-navy-text); text-decoration: none; font-family: var(--font-mono); font-size: 0.78rem; }
.project-media-frame { position: relative; width: 100%; aspect-ratio: 16 / 10; border-radius: 18px; background-color: #0B0E14; border: 1px solid var(--color-navy-border); overflow: hidden; }
.project-media-frame.is-mobile { aspect-ratio: 4 / 5; max-width: 440px; margin: 0 auto; }
.project-media-frame img { width: 100%; height: 100%; object-fit: cover; }

.section-stack { padding: 8rem 3.5rem; max-width: 1560px; margin: 0 auto; }
.stack-categories-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2rem; margin-top: 3rem; }
.stack-category-card { padding: 2.25rem; border-radius: 18px; background-color: var(--card-current); border: 1px solid var(--border-current); }
.stack-cat-title { font-family: var(--font-mono); font-size: 0.75rem; text-transform: uppercase; color: var(--color-steel); margin-bottom: 1.5rem; }

.footer-inner { max-width: 1560px; margin: 0 auto; display: flex; flex-direction: column; justify-content: space-between; min-height: 60vh; }
.footer-invitation-lead { font-family: var(--font-mono); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.15em; color: var(--color-steel-light); margin-bottom: 2rem; }
.footer-huge-cta { font-size: clamp(3rem, 7vw, 7.5rem); font-weight: 400; line-height: 0.95; margin-bottom: 4rem; }
.footer-huge-cta .serif-italic { font-family: var(--font-display); font-style: italic; color: var(--color-parchment); }
.contact-interactive-tray { display: flex; align-items: center; gap: 2rem; margin-bottom: 6rem; flex-wrap: wrap; }
.email-copy-pill { display: inline-flex; align-items: center; gap: 1.25rem; padding: 1.2rem 2.25rem; border-radius: 999px; background-color: var(--color-navy-card); border: 1px solid var(--color-navy-border); font-family: var(--font-mono); font-size: 1.05rem; color: var(--color-navy-text); cursor: pointer; }
.copy-indicator { font-size: 0.75rem; padding: 0.25rem 0.65rem; border-radius: 999px; background-color: rgba(58, 96, 128, 0.25); color: var(--color-steel-light); }
.footer-bottom-bar { display: flex; justify-content: space-between; align-items: center; padding-top: 2rem; border-top: 1px solid var(--color-navy-border); font-family: var(--font-mono); font-size: 0.75rem; color: var(--color-navy-muted); flex-wrap: wrap; gap: 1.5rem; }
.footer-social-row { display: flex; gap: 2rem; }
.footer-social-link { color: var(--color-navy-text); text-decoration: none; }

@media (max-width: 1024px) {

  .section-hero { padding: 9rem 2rem 4rem; }
  .hero-subhead-row { grid-template-columns: 1fr; gap: 2rem; }
  .philosophy-grid { grid-template-columns: 1fr; }
  .project-item { grid-template-columns: 1fr; padding: 2.5rem; }
  .stack-categories-grid { grid-template-columns: repeat(2, 1fr); }

}
@media (max-width: 640px) {

  .stack-categories-grid { grid-template-columns: 1fr; }
